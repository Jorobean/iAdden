<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/oswald');

  :root{
    --bg:#1C1E22;
    --bg-raised:#24272C;
    --bg-card:#2A2D33;
    --line:#33363B;
    --text:#F5F2EC;
    --text-dim:#9A9DA3;
    --accent:#D9622B;
    --accent-dim:#8a4420;
    --good:#3E7C7C;
    --good-dim:#2a5555;
    --warn:#D9622B;
    --danger:#C4432E;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  .gauge-font{font-family:'Oswald','Arial Narrow',sans-serif; font-weight:600; letter-spacing:0.5px;}

  /* ---------- Top bar ---------- */
  header{
    padding:18px 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(28,30,34,0.92);backdrop-filter:blur(8px);
    z-index:20;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand svg{width:26px;height:26px;}
  header h1{font-size:15px;letter-spacing:2px;text-transform:uppercase;margin:0;color:var(--text-dim);font-weight:600;}
  header .actions{display:flex;gap:14px;align-items:center;}
  header button.icon-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;padding:6px;
    display:flex;align-items:center;justify-content:center;
  }
  header button.icon-btn:hover{color:var(--text);}

  /* ---------- Vehicle switcher tabs ---------- */
  .garage-tabs{
    display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
    border-bottom:1px solid var(--line);
  }
  .garage-tabs::-webkit-scrollbar{display:none;}
  .garage-tab{
    flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
    background:var(--bg-raised);color:var(--text-dim);font-size:13px;cursor:pointer;
    white-space:nowrap;font-weight:500;
  }
  .garage-tab.active{background:var(--accent);border-color:var(--accent);color:#1C1E22;font-weight:700;}
  .garage-tab.add-tab{color:var(--good);border-color:var(--good-dim);}

  /* ---------- Hero vehicle card ---------- */
  .vehicle-hero{padding:20px 18px 8px;}
  .vehicle-photo-wrap{
    width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(135deg,#2E3238,#1A1C20);
    position:relative;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  .vehicle-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-placeholder{color:var(--text-dim);text-align:center;padding:20px;}
  .photo-placeholder svg{width:64px;height:64px;opacity:0.35;margin-bottom:6px;}
  .photo-placeholder span{display:block;font-size:12px;}
  .photo-upload-btn{
    position:absolute;bottom:10px;right:10px;background:rgba(28,30,34,0.85);
    border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:7px 11px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center;
  }
  .vehicle-title{font-size:22px;font-weight:700;margin:0 0 2px;}
  .vehicle-sub{color:var(--text-dim);font-size:13px;margin:0 0 14px;}

  /* Odometer control */
  .odo-panel{
    background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
  }
  .odo-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:4px;}
  .odo-value{font-size:30px;display:flex;align-items:baseline;gap:6px;}
  .odo-value span.unit{font-size:13px;color:var(--text-dim);font-weight:400;letter-spacing:1px;}
  .odo-edit-btn{
    background:var(--accent);color:#1C1E22;border:none;border-radius:10px;
    padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .odo-edit-btn:active{transform:scale(0.97);}

  /* ---------- Section nav ---------- */
  nav.tabs{
    display:flex;border-bottom:1px solid var(--line);padding:0 18px;position:sticky;top:57px;
    background:var(--bg);z-index:19;overflow-x:auto;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:none;border:none;color:var(--text-dim);padding:12px 14px;font-size:13px;
    font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  main{flex:1;padding:16px 18px 100px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Strength banner ---------- */
  .strength-banner{
    display:flex;align-items:center;gap:12px;background:var(--bg-raised);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;
  }
  .strength-ring{flex:0 0 auto;}
  .strength-text{font-size:13px;color:var(--text-dim);}
  .strength-text b{color:var(--text);}

  /* ---------- Gauge item cards ---------- */
  .gauge-card{
    display:flex;align-items:center;gap:14px;background:var(--bg-card);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;
    cursor:pointer;
  }
  .gauge-card:active{background:var(--bg-raised);}
  .ring-wrap{position:relative;flex:0 0 auto;width:56px;height:56px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .ring-bg{stroke:var(--line);}
  .ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .ring-center svg{width:22px;height:22px;stroke:var(--text-dim);}
  .gauge-info{flex:1;min-width:0;}
  .gauge-title{font-size:15px;font-weight:600;margin-bottom:2px;}
  .gauge-detail{font-size:12px;color:var(--text-dim);}
  .gauge-right{text-align:right;flex:0 0 auto;}
  .gauge-right .num{font-size:18px;font-weight:700;}
  .gauge-right .lbl{font-size:11px;color:var(--text-dim);}
  .status-pill{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
    padding:3px 8px;border-radius:20px;display:inline-block;margin-top:4px;
  }
  .pill-good{background:rgba(62,124,124,0.2);color:#6FBFBF;}
  .pill-warn{background:rgba(217,98,43,0.2);color:#F0925E;}
  .pill-over{background:rgba(196,67,46,0.25);color:#F0776A;}
  .pill-track{background:rgba(154,157,163,0.15);color:var(--text-dim);}

  .chevron{color:var(--text-dim);flex:0 0 auto;}

  /* ---------- History list ---------- */
  .log-entry{
    background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;
  }
  .log-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .log-cat{font-size:14px;font-weight:700;}
  .log-cost{font-size:15px;font-weight:700;color:var(--accent);}
  .log-meta{font-size:12px;color:var(--text-dim);display:flex;gap:10px;flex-wrap:wrap;}
  .log-notes{font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.4;}
  .log-actions{display:flex;gap:14px;margin-top:8px;}
  .log-actions button{background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;padding:0;}
  .log-actions button:hover{color:var(--accent);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state svg{width:48px;height:48px;opacity:0.3;margin-bottom:10px;}
  .empty-state p{font-size:13px;margin:0;}

  /* ---------- Cost summary ---------- */
  .cost-summary{display:flex;gap:10px;margin-bottom:16px;}
  .cost-tile{flex:1;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;}
  .cost-tile .amt{font-size:20px;font-weight:700;}
  .cost-tile .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}

  /* ---------- Shops ---------- */
  .shop-card{
    background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  .shop-name{font-weight:700;font-size:14px;margin-bottom:3px;}
  .shop-meta{font-size:12px;color:var(--text-dim);}
  .shop-fav{color:var(--accent);flex:0 0 auto;background:none;border:none;cursor:pointer;}

  /* ---------- Floating add button ---------- */
  .fab{
    position:fixed;bottom:22px;right:22px;width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#1C1E22;border:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(217,98,43,0.4);cursor:pointer;z-index:25;max-width:520px;
  }
  .fab:active{transform:scale(0.95);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,11,13,0.7);z-index:50;display:none;
    align-items:flex-end;justify-content:center;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--bg-raised);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
  .modal h2{font-size:18px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px;color:var(--text);font-size:15px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:13px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#1C1E22;}
  .btn-secondary{background:var(--bg-card);color:var(--text);border:1px solid var(--line);}
  .btn-danger{background:rgba(196,67,46,0.2);color:#F0776A;}
  .btn:active{transform:scale(0.98);}

  select option{background:var(--bg-raised);}

  ::-webkit-scrollbar{width:0;height:0;}

  @media (min-width:521px){
    .fab{right:calc(50% - 260px + 22px);}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><path d="M3 13h18v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="16.5" r="1.2" fill="currentColor"/><circle cx="16.5" cy="16.5" r="1.2" fill="currentColor"/></svg>
      <h1>The Garage</h1>
    </div>
    <div class="actions">
      <button class="icon-btn" id="exportBtn" title="Export data">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </button>
    </div>
  </header>

  <div class="garage-tabs" id="garageTabs"></div>

  <div class="vehicle-hero">
    <div class="vehicle-photo-wrap" id="photoWrap">
      <div class="photo-placeholder" id="photoPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><path d="M3 13h18v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
        <span>No photo yet</span>
      </div>
      <img id="vehicleImg" style="display:none;">
      <button class="photo-upload-btn" id="photoUploadBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M12 3v13m0 0l-4-4m4 4l4-4"/></svg>
        Photo
      </button>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
    </div>
    <h2 class="vehicle-title" id="vehicleTitle">—</h2>
    <p class="vehicle-sub" id="vehicleSub">—</p>

    <div class="odo-panel">
      <div>
        <div class="odo-label">Current Mileage</div>
        <div class="odo-value gauge-font"><span id="odoValue">0</span><span class="unit">MILES</span></div>
      </div>
      <button class="odo-edit-btn" id="updateMilesBtn">Update</button>
    </div>
  </div>

  <nav class="tabs">
    <button class="active" data-view="dash">Dash</button>
    <button data-view="history">History</button>
    <button data-view="costs">Costs</button>
    <button data-view="shops">Shops</button>
  </nav>

  <main>
    <!-- DASH VIEW -->
    <section class="view active" id="view-dash">
      <div class="strength-banner">
        <div class="strength-ring">
          <svg width="44" height="44" viewBox="0 0 44 44">
            <circle class="ring-bg" cx="22" cy="22" r="18" fill="none" stroke-width="5"/>
            <circle id="strengthArc" cx="22" cy="22" r="18" fill="none" stroke="#D9622B" stroke-width="5" stroke-linecap="round" transform="rotate(-90 22 22)"/>
          </svg>
        </div>
        <div class="strength-text">Dashboard Strength: <b id="strengthPct">0%</b><br>Log services to sharpen your reminders.</div>
      </div>
      <div id="gaugeList"></div>
    </section>

    <!-- HISTORY VIEW -->
    <section class="view" id="view-history">
      <div id="historyList"></div>
    </section>

    <!-- COSTS VIEW -->
    <section class="view" id="view-costs">
      <div class="cost-summary">
        <div class="cost-tile"><div class="amt" id="costYear">$0</div><div class="lbl">This Year</div></div>
        <div class="cost-tile"><div class="amt" id="costTotal">$0</div><div class="lbl">All Time</div></div>
      </div>
      <div id="costList"></div>
    </section>

    <!-- SHOPS VIEW -->
    <section class="view" id="view-shops">
      <div id="shopList"></div>
    </section>
  </main>

  <button class="fab" id="fabBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
  </button>

</div>

<!-- MODALS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

let state = {

  shops: [] // {id, name, phone, notes, favorite}

const STORAGE_KEY = "garage-app-state";
let dataReady = false;

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    console.log("No existing state, starting fresh.");
  }
  if(state.vehicles.length === 0){
    seedDefaultVehicle();
  }
  dataReady = true;
  renderAll();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){
    console.error("Save failed", e);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function activeVehicle(){
  return state.vehicles.find(v => v.id === state.activeVehicleId) || state.vehicles[0];
}
function scheduleFor(vehicle){
  if(vehicle.knownKey && KNOWN_VEHICLES[vehicle.knownKey]) return KNOWN_VEHICLES[vehicle.knownKey].schedule;
  return GENERIC_SCHEDULE;
}
function lastServiceFor(vehicleId, key){
  const entries = state.serviceLog.filter(e => e.vehicleId === vehicleId && e.key === key);
  if(entries.length === 0) return null;
  return entries.reduce((a,b) => new Date(a.date) > new Date(b.date) ? a : b);
}
function monthsBetween(d1, d2){
  return (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
}
function fmtMoney(n){ return "$" + Number(n).toLocaleString(undefined,{maximumFractionDigits:0}); }
function fmtMiles(n){ return Number(n).toLocaleString(); }
function uid(){ return "id_" + Date.now() + "_" + Math.floor(Math.random()*10000); }

function computeItemStatus(vehicle, item){
  const last = lastServiceFor(vehicle.id, item.key);
  const currentMiles = vehicle.mileage;
  let baselineMiles, baselineDate;
  if(last){
    baselineMiles = last.miles;
    baselineDate = new Date(last.date);
  } else {
    // no record yet — assume item is "due tracking start" from now, use 0 baseline mileage-wise
    baselineMiles = Math.max(0, currentMiles - item.miles); // assume partially through interval unknown -> start fresh at current
    baselineDate = new Date(); // unknown; treat as just started
  }
  const milesUsed = last ? (currentMiles - baselineMiles) : 0;
  const milesRemaining = item.miles - milesUsed;
  const milesPct = last ? Math.min(1, Math.max(0, milesUsed / item.miles)) : 0;

  let monthsUsed = 0, monthsRemaining = item.months, monthsPct = 0;
  if(last){
    monthsUsed = monthsBetween(baselineDate, new Date());
    monthsRemaining = item.months - monthsUsed;
    monthsPct = Math.min(1, Math.max(0, monthsUsed / item.months));
  }

  // overall progress = whichever constraint is closer to due (higher pct)
  const pct = last ? Math.max(milesPct, monthsPct) : 0;
  const hasRecord = !!last;

  let statusLabel, statusClass;
  if(!hasRecord){
    statusLabel = "Start Tracking"; statusClass = "track";
  } else if(pct >= 1){
    statusLabel = "Past Due"; statusClass = "over";
  } else if(pct >= 0.85){
    statusLabel = "Due Soon"; statusClass = "warn";
  } else {
    statusLabel = "On Track"; statusClass = "good";
  }

  return {hasRecord, pct, milesRemaining, monthsRemaining, statusLabel, statusClass, last};
}

/* ============================================================
   RENDER: HEADER / VEHICLE
   ============================================================ */
function renderGarageTabs(){
  const el = document.getElementById("garageTabs");
  el.innerHTML = "";
  state.vehicles.forEach(v => {
    const btn = document.createElement("button");
    btn.className = "garage-tab" + (v.id === state.activeVehicleId ? " active" : "");
    btn.textContent = `${v.year} ${v.make} ${v.model}`;
    btn.onclick = () => { state.activeVehicleId = v.id; saveState(); renderAll(); };
    el.appendChild(btn);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "garage-tab add-tab";
  addBtn.textContent = "+ Add Car";
  addBtn.onclick = openAddVehicleModal;
  el.appendChild(addBtn);
}

function renderVehicleHero(){
  const v = activeVehicle();
  if(!v) return;
  document.getElementById("vehicleTitle").textContent = `${v.year} ${v.make} ${v.model}${v.trim ? " " + v.trim : ""}`;
  document.getElementById("vehicleSub").textContent = KNOWN_VEHICLES[v.knownKey] ? "Manufacturer schedule loaded" : "Using generic maintenance intervals";
  document.getElementById("odoValue").textContent = fmtMiles(v.mileage);

  const img = document.getElementById("vehicleImg");
  const ph = document.getElementById("photoPlaceholder");
  if(v.photo){
    img.src = v.photo; img.style.display = "block"; ph.style.display = "none";
  } else {
    img.style.display = "none"; ph.style.display = "block";
  }
}

/* ============================================================
   RENDER: DASH (gauges)
   ============================================================ */
function ringSvg(pct, statusClass, iconKey){
  const r = 22, c = 2*Math.PI*r;
  const colorMap = {good:"#3E7C7C", warn:"#D9622B", over:"#C4432E", track:"#5A5D63"};
  const color = colorMap[statusClass] || "#5A5D63";
  const offset = c * (1 - pct);
  return `
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="ring-bg" cx="28" cy="28" r="${r}" fill="none" stroke-width="5"/>
      <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 28 28)"/>
    </svg>
    <div class="ring-center"><svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8">${ICONS[iconKey]||""}</svg></div>
  `;
}

function renderDash(){
  const v = activeVehicle();
  if(!v) return;
  const schedule = scheduleFor(v);
  const list = document.getElementById("gaugeList");
  list.innerHTML = "";

  let filledCount = 0;
  schedule.forEach(item => {
    const st = computeItemStatus(v, item);
    if(st.hasRecord) filledCount++;
    const card = document.createElement("div");
    card.className = "gauge-card";
    card.onclick = () => openLogModal(item);

    let rightHtml;
    if(!st.hasRecord){
      rightHtml = `<div class="lbl" style="color:var(--good);font-weight:700;">Start Tracking</div>`;
    } else if(st.statusClass === "over"){
      rightHtml = `<div class="num" style="color:var(--danger)">Past Due</div>`;
    } else {
      const milesLeft = Math.max(0, Math.round(st.milesRemaining));
      rightHtml = `<div class="num">${st.monthsRemaining > 0 ? st.monthsRemaining : 0}</div><div class="lbl">months left</div>`;
    }

    card.innerHTML = `
      <div class="ring-wrap">${ringSvg(st.pct, st.statusClass, item.icon)}</div>
      <div class="gauge-info">
        <div class="gauge-title">${item.label}</div>
        <div class="gauge-detail">${st.hasRecord ? "Last: " + fmtMiles(st.last.miles) + " mi · " + new Date(st.last.date).toLocaleDateString() : "No recent service record"}</div>
      </div>
      <div class="gauge-right">${rightHtml}</div>
      <div class="chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
    `;
    list.appendChild(card);
  });

  const strength = Math.round((filledCount / schedule.length) * 100);
  document.getElementById("strengthPct").textContent = strength + "%";
  const r = 18, c = 2*Math.PI*r;
  document.getElementById("strengthArc").setAttribute("stroke-dasharray", c);
  document.getElementById("strengthArc").setAttribute("stroke-dashoffset", c * (1 - strength/100));
}

/* ============================================================
   RENDER: HISTORY
   ============================================================ */
function renderHistory(){
  const v = activeVehicle();
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  const entries = state.serviceLog.filter(e => e.vehicleId === v.id).sort((a,b) => new Date(b.date) - new Date(a.date));

  if(entries.length === 0){
    list.innerHTML = emptyState("No service history yet", "Log a service from the Dash tab or tap + to add one.");
    return;
  }
  entries.forEach(e => {
    const div = document.createElement("div");
    div.className = "log-entry";
    div.innerHTML = `
      <div class="log-top">
        <div class="log-cat">${e.label}</div>
        ${e.cost ? `<div class="log-cost">${fmtMoney(e.cost)}</div>` : ""}
      </div>
      <div class="log-meta">
        <span>${new Date(e.date).toLocaleDateString()}</span>
        <span>${fmtMiles(e.miles)} mi</span>
        ${e.shop ? `<span>${e.shop}</span>` : ""}
      </div>
      ${e.notes ? `<div class="log-notes">${escapeHtml(e.notes)}</div>` : ""}
      <div class="log-actions">
        <button data-action="delete" data-id="${e.id}">Delete</button>
      </div>
    `;
    div.querySelector('[data-action="delete"]').onclick = () => {
      state.serviceLog = state.serviceLog.filter(x => x.id !== e.id);
      saveState(); renderAll();
    };
    list.appendChild(div);
  });
}

/* ============================================================
   RENDER: COSTS
   ============================================================ */
function renderCosts(){
  const v = activeVehicle();
  const entries = state.serviceLog.filter(e => e.vehicleId === v.id && e.cost);
  const now = new Date();
  const yearTotal = entries.filter(e => new Date(e.date).getFullYear() === now.getFullYear())
    .reduce((s,e) => s + Number(e.cost), 0);
  const allTotal = entries.reduce((s,e) => s + Number(e.cost), 0);
  document.getElementById("costYear").textContent = fmtMoney(yearTotal);
  document.getElementById("costTotal").textContent = fmtMoney(allTotal);

  const list = document.getElementById("costList");
  list.innerHTML = "";
  if(entries.length === 0){
    list.innerHTML = emptyState("No costs logged yet", "Add a cost when you log a service.");
    return;
  }
  entries.sort((a,b) => new Date(b.date)-new Date(a.date)).forEach(e => {
    const div = document.createElement("div");
    div.className = "log-entry";
    div.innerHTML = `
      <div class="log-top">
        <div class="log-cat">${e.label}</div>
        <div class="log-cost">${fmtMoney(e.cost)}</div>
      </div>
      <div class="log-meta"><span>${new Date(e.date).toLocaleDateString()}</span><span>${fmtMiles(e.miles)} mi</span></div>
    `;
    list.appendChild(div);
  });
}

/* ============================================================
   RENDER: SHOPS
   ============================================================ */
function renderShops(){
  const list = document.getElementById("shopList");
  list.innerHTML = "";
  if(state.shops.length === 0){
    list.innerHTML = emptyState("No shops saved", "Tap + to add a trusted mechanic or shop.");
    return;
  }
  state.shops.forEach(s => {
    const div = document.createElement("div");
    div.className = "shop-card";
    div.innerHTML = `
      <div>
        <div class="shop-name">${escapeHtml(s.name)}</div>
        <div class="shop-meta">${s.phone ? escapeHtml(s.phone) : ""}${s.phone && s.notes ? " · " : ""}${s.notes ? escapeHtml(s.notes) : ""}</div>
      </div>
      <button class="shop-fav" data-id="${s.id}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="${s.favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 5.5 3.5C14 6.2 15.5 5 17.5 5 21 5 23.5 8.5 21.5 12.5 19 16.65 12 21 12 21z"/></svg>
      </button>
    `;
    div.querySelector(".shop-fav").onclick = () => {
      s.favorite = !s.favorite; saveState(); renderShops();
    };
    list.appendChild(div);
  });
}

function emptyState(title, sub){
  return `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
    <p><b>${title}</b></p><p>${sub}</p>
  </div>`;
}
function escapeHtml(str){
  const d = document.createElement("div"); d.textContent = str; return d.innerHTML;
}

function renderAll(){
  if(!dataReady) return;
  renderGarageTabs();
  renderVehicleHero();
  renderDash();
  renderHistory();
  renderCosts();
  renderShops();
}

/* ============================================================
   MODALS
   ============================================================ */
function showModal(html){
  document.getElementById("modalBody").innerHTML = `<div class="modal-handle"></div>` + html;
  document.getElementById("modalOverlay").classList.add("active");
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("active");
}
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if(e.target.id === "modalOverlay") closeModal();
});

function openUpdateMilesModal(){
  const v = activeVehicle();
  showModal(`
    <h2>Update Mileage</h2>
    <div class="field">
      <label>Current Odometer</label>
      <input type="number" id="milesInput" value="${v.mileage}" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  `);
  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("saveBtn").onclick = () => {
    const val = parseInt(document.getElementById("milesInput").value, 10);
    if(!isNaN(val) && val >= 0){
      v.mileage = val;
      v.lastUpdated = new Date().toISOString();
      saveState(); renderAll(); closeModal();
    }
  };
}

function openLogModal(item){
  const v = activeVehicle();
  showModal(`
    <h2>Log: ${item.label}</h2>
    <div class="field">
      <label>Date</label>
      <input type="date" id="logDate" value="${new Date().toISOString().slice(0,10)}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Mileage</label>
        <input type="number" id="logMiles" value="${v.mileage}" inputmode="numeric">
      </div>
      <div class="field">
        <label>Cost ($)</label>
        <input type="number" id="logCost" placeholder="0" inputmode="decimal">
      </div>
    </div>
    <div class="field">
      <label>Shop / Mechanic</label>
      <input type="text" id="logShop" placeholder="e.g. Joe's Auto">
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="logNotes" placeholder="Any details worth remembering..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Entry</button>
    </div>
  `);
  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("saveBtn").onclick = () => {
    const date = document.getElementById("logDate").value;
    const miles = parseInt(document.getElementById("logMiles").value, 10);
    const cost = parseFloat(document.getElementById("logCost").value) || 0;
    const shop = document.getElementById("logShop").value.trim();
    const notes = document.getElementById("logNotes").value.trim();
    if(!date || isNaN(miles)) return;
    state.serviceLog.push({
      id: uid(), vehicleId: v.id, key: item.key, label: item.label,
      date, miles, cost, shop, notes
    });
    if(miles > v.mileage){ v.mileage = miles; }
    saveState(); renderAll(); closeModal();
  };
}

function openAddVehicleModal(){
  showModal(`
    <h2>Add a Car</h2>
    <div class="field-row">
      <div class="field"><label>Year</label><input type="number" id="addYear" placeholder="2020"></div>
      <div class="field"><label>Make</label><input type="text" id="addMake" placeholder="Honda"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Model</label><input type="text" id="addModel" placeholder="Civic"></div>
      <div class="field"><label>Trim</label><input type="text" id="addTrim" placeholder="EX (optional)"></div>
    </div>
    <div class="field">
      <label>Current Mileage</label>
      <input type="number" id="addMiles" placeholder="45000" inputmode="numeric">
    </div>
    <p style="font-size:12px;color:var(--text-dim);line-height:1.5;">
      This vehicle will use generic maintenance intervals unless its manufacturer schedule has been added to the app already.
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Add to Garage</button>
    </div>
  `);
  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("saveBtn").onclick = () => {
    const year = parseInt(document.getElementById("addYear").value, 10);
    const make = document.getElementById("addMake").value.trim();
    const model = document.getElementById("addModel").value.trim();
    const trim = document.getElementById("addTrim").value.trim();
    const miles = parseInt(document.getElementById("addMiles").value, 10) || 0;
    if(!year || !make || !model) return;

    // check known vehicles by simple key match
    const keyGuess = `${make.toLowerCase()}-${model.toLowerCase().replace(/\s+/g,'')}-${year}`;
    const knownKey = KNOWN_VEHICLES[keyGuess] ? keyGuess : null;

    const v = {
      id: uid(), knownKey, year, make, model, trim,
      mileage: miles, photo: null, lastUpdated: new Date().toISOString()
    };
    state.vehicles.push(v);
    state.activeVehicleId = v.id;
    saveState(); renderAll(); closeModal();
  };
}

function openAddShopModal(){
  showModal(`
    <h2>Add a Shop</h2>
    <div class="field"><label>Name</label><input type="text" id="shopName" placeholder="Joe's Auto Repair"></div>
    <div class="field"><label>Phone</label><input type="text" id="shopPhone" placeholder="(555) 555-1234"></div>
    <div class="field"><label>Notes</label><textarea id="shopNotes" placeholder="Specialty, hours, etc."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Shop</button>
    </div>
  `);
  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("saveBtn").onclick = () => {
    const name = document.getElementById("shopName").value.trim();
    const phone = document.getElementById("shopPhone").value.trim();
    const notes = document.getElementById("shopNotes").value.trim();
    if(!name) return;
    state.shops.push({id: uid(), name, phone, notes, favorite:false});
    saveState(); renderAll(); closeModal();
  };
}

function openQuickAddModal(){
  const view = document.querySelector(".view.active").id;
  if(view === "view-shops"){ openAddShopModal(); return; }
  if(view === "view-history" || view === "view-costs"){
    // generic manual log entry
    const v = activeVehicle();
    showModal(`
      <h2>Log a Service</h2>
      <div class="field">
        <label>Category</label>
        <input type="text" id="logLabel" placeholder="e.g. Battery Replacement">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="logDate" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <div class="field-row">
        <div class="field"><label>Mileage</label><input type="number" id="logMiles" value="${v.mileage}"></div>
        <div class="field"><label>Cost ($)</label><input type="number" id="logCost" placeholder="0"></div>
      </div>
      <div class="field"><label>Shop</label><input type="text" id="logShop" placeholder="Optional"></div>
      <div class="field"><label>Notes</label><textarea id="logNotes"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    `);
    document.getElementById("cancelBtn").onclick = closeModal;
    document.getElementById("saveBtn").onclick = () => {
      const label = document.getElementById("logLabel").value.trim() || "Service";
      const date = document.getElementById("logDate").value;
      const miles = parseInt(document.getElementById("logMiles").value, 10);
      const cost = parseFloat(document.getElementById("logCost").value) || 0;
      const shop = document.getElementById("logShop").value.trim();
      const notes = document.getElementById("logNotes").value.trim();
      if(!date || isNaN(miles)) return;
      state.serviceLog.push({id: uid(), vehicleId: v.id, key:"custom_"+uid(), label, date, miles, cost, shop, notes});
      if(miles > v.mileage) v.mileage = miles;
      saveState(); renderAll(); closeModal();
    };
    return;
  }
  openAddVehicleModal();
}

/* ============================================================
   EXPORT
   ============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "garage-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
  });
});

document.getElementById("updateMilesBtn").onclick = openUpdateMilesModal;
document.getElementById("fabBtn").onclick = openQuickAddModal;
document.getElementById("exportBtn").onclick = exportData;

document.getElementById("photoUploadBtn").onclick = () => document.getElementById("photoInput").click();
document.getElementById("photoInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const v = activeVehicle();
    v.photo = ev.target.result;
    saveState(); renderAll();
  };
  reader.readAsDataURL(file);
});

loadState();
})();
</script>
